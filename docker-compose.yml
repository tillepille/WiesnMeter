services:
  wiesnmeter:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOSTNAME=https://${DOMAIN:-wiesnmeter.example.com}
      - DEV_MODE=${DEV_MODE:-false}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:-changeme-in-production-random-secret}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-wiesnmeter}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp-gateway-prod-eu-west-0.grafana.net/otlp}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-both}
      - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL:-5000}
      - GRAFANA_CLOUD_INSTANCE_ID=${GRAFANA_CLOUD_INSTANCE_ID:-}
      - GRAFANA_CLOUD_API_TOKEN=${GRAFANA_CLOUD_API_TOKEN:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    labels:
      - "traefik.enable=true"
      # Routing rule: match your domain name
      - "traefik.http.routers.wiesnmeter.rule=Host(`wiesnmeter.tillepille.io`)"
      - "traefik.http.routers.wiesnmeter.entrypoints=websecure"
      - "traefik.http.routers.wiesnmeter.tls=true"
      - "traefik.http.routers.wiesnmeter.tls.certresolver=dnsresolver"
      # Port on which the container runs
      - "traefik.http.services.wiesnmeter.loadbalancer.server.port=3000"
    networks:
      - traefik

networks:
  # External network shared with your existing Traefik instance
  traefik:
    external: true
